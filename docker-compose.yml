# Nexus Career Studio — self-hosted stack.
# web: the app. scheduler: wakes the agent every 15 min so it works with your browser closed.
# caddy (profile "https"): automatic HTTPS for $DOMAIN; start with: docker compose --profile https up -d --build
services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    env_file: .env
    # Set WEB_BIND=127.0.0.1 when Caddy fronts the app so port 3000 is not reachable over plain HTTP
    ports: ["${WEB_BIND:-0.0.0.0}:3000:3000"]
    # Lets the app reach services on this machine, e.g. Ollama at http://host.docker.internal:11434/v1 (needed on Linux)
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3

  scheduler:
    image: curlimages/curl:8.10.1
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$AGENT_TICK_SECRET" http://web:3000/api/public/agent-tick || echo "agent tick failed";
          sleep $${AGENT_INTERVAL_SECONDS:-900};
        done

  # Optional HTTPS: Caddy gets and renews a certificate for $DOMAIN (its A record must point at this
  # machine, with ports 80 and 443 open) and proxies to the app. Without DOMAIN it serves localhost only.
  caddy:
    profiles: ["https"]
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  # Optional portal helper — start with: docker compose --profile portal up -d
  portal-worker:
    profiles: ["portal"]
    build: ./worker
    env_file: .env
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
